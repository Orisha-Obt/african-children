<section id="projects" class="py-24 bg-gray-50 my-2">
  <div class="max-w-7xl mx-auto px-8">
    <!-- Header -->
    <div class="text-center mb-16">
      <h2 class="text-5xl font-bold mb-4">Our Impact</h2>
      <p class="text-gray-600 text-xl max-w-2xl mx-auto">
        Making a difference in African children's lives through sustainable
        education initiatives
      </p>
    </div>

    <!-- Completed Projects -->
    <div class="mb-20">
      <h3 class="text-3xl font-bold mb-8 flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-[#54a459]"></span>
        Completed Projects
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div
          *ngFor="let project of getProjectsByStatus('completed')"
          class="bg-white rounded-2xl p-8 shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-start justify-between mb-4">
            <div>
              <p class="text-[#b20012] font-bold text-5xl mb-2">
                {{ project.count }}
              </p>
              <h3 class="text-2xl font-semibold">{{ project.title }}</h3>
            </div>
            <span
              class="bg-[#54a459] bg-opacity-10 text-white font-bold px-3 py-1 rounded-full text-sm"
            >
              completed
            </span>
          </div>
          <p class="text-gray-600">
            {{ project.description }}
          </p>
        </div>
      </div>
    </div>

    <!-- Ongoing Projects -->
    <div>
      <h3 class="text-3xl font-bold mb-8 flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-[#df7f09]"></span>
        Ongoing Projects
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div
          *ngFor="let project of getProjectsByStatus('ongoing')"
          class="bg-white rounded-2xl p-8 shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-start justify-between mb-4">
            <div>
              <p class="text-[#b20012] font-bold text-5xl mb-2">
                {{ project.count }}
              </p>
              <h3 class="text-2xl font-semibold">{{ project.title }}</h3>
            </div>
            <span
              class="bg-[#df7f09] bg-opacity-10 text-white font-bold px-3 py-1 rounded-full text-sm"
            >
              ongoing
            </span>
          </div>
          <p class="text-gray-600">
            {{ project.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
