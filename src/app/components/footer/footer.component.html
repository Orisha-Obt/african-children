<!-- footer.component.html -->
<footer class="mt-8">
  <div class="relative w-full py-16 px-8 overflow-hidden">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap justify-between z-10 relative">
        <!-- Left Side / Logo Area -->
        <div class="w-full md:w-1/3 mb-8 md:mb-0">
          <div class="mb-6">
            <div class="flex flex-row items-center text-white gap-4">
              <img src="/logo.png" alt="Logo" class="h-15 w-auto" />
              <h1 class="text-xl font-bold">African Children Development</h1>
            </div>

            <p class="text-white text-sm whitespace-pre-line">
              {{ company.tagline }}
            </p>
            <p class="text-white text-xs mt-2">{{ company.brandBy }}</p>
          </div>

          <div class="flex flex-col mt-8">
            <div class="flex items-center mb-2">
              <svg
                class="w-4 h-4 text-white mr-2"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"
                ></path>
              </svg>
              <span class="text-white text-sm">{{ company.phone }}</span>
            </div>
            <div class="flex items-center">
              <svg
                class="w-4 h-4 text-white mr-2"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"
                ></path>
                <path
                  d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"
                ></path>
              </svg>
              <span class="text-white text-sm">{{ company.email }}</span>
            </div>
          </div>
        </div>

        <!-- Right Side / Navigation -->
        <div class="w-full md:w-1/2">
          <div class="grid grid-cols-1 md:grid-cols-1 gap-8">
            <div class="text-right">
              <ul class="space-y-4">
                <li *ngFor="let link of navLinks">
                  <a
                    [routerLink]="link.url"
                    [fragment]="link.fragment"
                    class="text-white text-xl font-medium hover:underline transition-colors duration-200"
                    >{{ link.name }}</a
                  >
                </li>
              </ul>

              <div class="mt-12 text-white text-xs space-y-1">
                <p *ngFor="let link of infoLinks">
                  <a
                    [href]="link.url"
                    class="hover:underline transition-colors duration-200"
                    target="{{
                      link.url.startsWith('http') ? '_blank' : '_self'
                    }}"
                    >{{ link.name }}</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SVG Background -->
    <svg
      class="absolute inset-0 w-full h-full z-0"
      viewBox="0 0 1200 400"
      preserveAspectRatio="none"
    >
      <!-- Main background shape -->
      <path
        d="
                M 0 10
                Q 0 0, 10 0
    
                L 1190 0 
                Q 1200 0, 1200 10 

                L 1200 350    
                Q 1200 360, 1190 360 

                L 1200 360
                Q 1200 360, 1180 360
                
                L 1000 360
                Q 990 360, 990 370
    
                L 990 390    
                Q 990 400, 980 400 
    
                L 10 400
                Q 0 400, 0 390
                Z
              "
        fill="#b20012"
      />
    </svg>
  </div>
</footer>
